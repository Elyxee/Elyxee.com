<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Burn lifecycle regression</title>
<style>
  body { margin: 0; background: #111; color: #eee; font: 14px monospace; }
  pre { position: fixed; z-index: 2; inset: auto 16px 16px; padding: 16px; background: #111e; white-space: pre-wrap; }
</style>
<pre id="results" role="status">Running actual WebGL simulation…</pre>
<script type="module">
  import { initBurn } from '../components/burn/index.js?v=77';

  const resizeEvents = [];
  window.addEventListener("resize",()=>resizeEvents.push([performance.now(),innerWidth,innerHeight]));
  const output = document.querySelector('#results');
  const results = [];
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
  const until = async (condition, timeout = 10000) => {
    const start = performance.now();
    while (!condition()) {
      if (performance.now() - start > timeout) throw new Error('Timed out waiting for lifecycle transition');
      await wait(50);
    }
  };
  function check(condition, message) {
    if (!condition) throw new Error(message);
    results.push(`PASS ${message}`);
    output.textContent = results.join('\n');
  }
  const burn = initBurn({
    autoPointer: false,
    statePrecision: new URLSearchParams(location.search).get("precision") || undefined,
    // Isolate cooling from propagation and accelerate recovery to make an
    // early-healing regression decisive within a few seconds.
    settings: { spreadRate: 0, combustion: 0, radius: 0.075,
      recoverySeconds: 1.5 },
  });
  try {
    check(burn.supported, `WebGL available (${burn.getState().precision})`);
    burn.setPointer(innerWidth / 2, innerHeight / 2);
    burn.setPointerActive(true);
    await wait(900);
    burn.setPointerActive(false);
    await wait(900);
    const partial = burn.getState();
    check(partial.coverage > 0 && partial.coverage < 0.1, 'Only a small patch was burned');
    await wait(3500);
    const cooled = burn.getState();
    check(cooled.phase === 'burning' && !cooled.healing && cooled.spreadMode === 1,
      'Cooling a partial burn never starts healing or skips to pinpoint');
    check(cooled.damageMean >= partial.damageMean * 0.98,
      'Partial damage survives beyond the recovery hold (no early knit-back)');

    burn.settings.radius = 8;
    burn.setPointerActive(true);
    await until(() => burn.getState().sheetTaken);
    const complete = burn.getState();
    check(complete.coverage >= burn.settings.recoverCoverageDone,
      'First recovery waits for every simulation pixel to burn through');
    check(complete.phase === 'recovering' && !complete.healing && !complete.sourceEnabled,
      'At 100% burn-through the vortex starts while healing stays locked');
    check(complete.recoveryHoldRemaining > 2.8 && complete.recoveryHoldRemaining <= 3,
      'Default vortex hold starts with three seconds before recovery');
    await until(() => burn.getState().healing);
    check(burn.getState().healing, 'Healing starts only after the vortex hold ends');
    burn.settings.recoverySeconds = 10;
    // Keep the pointer present through recovery: it must not relight the sheet
    // or stall the cold-to-flame handoff.
    await until(() => burn.getState().phase === 'pinpoint');
    burn.setPointerActive(false);
    const handoff = burn.getState();
    check(handoff.spreadMode === 0 && handoff.recovery >= 0.975 && handoff.coverage === 0,
      'At least 97.5% of sheet restored with no holes before returning to flame');
    check(!handoff.sourceEnabled && handoff.healing,
      'Stationary pointer cannot ignite a fresh hole on vortex-to-flame handoff');
    check(handoff.recoveryVisualMix === 1 && !handoff.laterVisual,
      'Returning flame retains the recovery renderer while background damage remains');
    await until(() => burn.getState().laterVisual);
    check(burn.getState().damageMax <= 0.02,
      'Background continues healing before its renderer is released');
    await wait(120);
    check(burn.getState().recoveryVisualMix > 0 && burn.getState().recoveryVisualMix < 1,
      'Finishing the background crossfades renderers instead of switching in one frame');
    await until(() => burn.getState().recoveryVisualMix === 0);
    burn.settings.recoverySeconds = 1.5;

    burn.settings.radius = 0.075;
    await wait(900);
    burn.setPointer(innerWidth * 0.25, innerHeight * 0.5);
    burn.setPointerActive(true);
    check(!burn.getState().healing, 'New movement locks later-pass recovery immediately');
    await wait(900);
    const laterDamage = burn.getState().damageMean;
    // Moving even over cold background must keep the recovery lock armed.
    for (let i = 0; i < 6; i++) {
      burn.setPointer(innerWidth * (0.70 + i * 0.01), innerHeight * 0.12);
      await wait(600);
      check(!burn.getState().healing, `Movement keeps recovery locked (${i + 1})`);
    }
    check(burn.getState().damageMean >= laterDamage * 0.98,
      'Earlier damage stays open while pointer moves elsewhere');
    burn.setPointer(innerWidth * 0.90, innerHeight * 0.12);
    await wait(29000);
    check(!burn.getState().healing && burn.getState().sourceEnabled,
      'A parked pointer still holds recovery at 29 seconds');
    await until(() => burn.getState().healing, 3000);
    check(!burn.getState().sourceEnabled, 'After 30 idle seconds heating stops and recovery starts');
    await until(() => burn.getState().damageMean < laterDamage * 0.25);
    check(true, 'Idle recovery closes later burns without a permanently hot cursor spot');
    burn.setPointer(innerWidth * 0.5, innerHeight * 0.5);
    check(!burn.getState().healing && burn.getState().sourceEnabled,
      'Movement resumes burning and pauses healing');
    await wait(600);
    burn.setPointerActive(false);
    check(burn.getState().healing, 'Leaving the page allows recovery without waiting 30 seconds');

    burn.reset();
    burn.settings.radius = 0.075;
    const reset = burn.getState();
    check(reset.phase === 'burning' && !reset.healing && !reset.sheetTaken,
      'Reset restores the first-burn recovery lock');
    output.dataset.result = 'pass';
    output.textContent = `ALL ${results.length} CHECKS PASSED\n${results.join('\n')}`;
  } catch (error) {
    output.dataset.result = 'fail';
    output.textContent = `${results.join('\n')}\nFAIL ${error.message}\n${JSON.stringify(burn.getState())}\nResize events: ${JSON.stringify(resizeEvents)}`;
  } finally {
    burn.setPointerActive(false);
    burn.pause();
  }
</script>
</html>
